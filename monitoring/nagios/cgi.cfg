###############################################################################
# CGI.CFG - Web interface access control
#
# The JSON CGIs (statusjson.cgi, objectjson.cgi, archivejson.cgi) honour the
# same authentication as the classic CGIs. The monitoring interface forwards
# the operator's Basic Auth credentials on every request.
#
# Replace the default `nagiosadmin` password before exposing any of this
# beyond a private network — see monitoring/README.md.
###############################################################################

main_config_file=/usr/local/nagios/etc/nagios.cfg
physical_html_path=/usr/local/nagios/share
url_html_path=/nagios/

# Require authentication for every CGI, including the JSON API.
use_authentication=1

# When authentication is required, this is what unauthenticated users are
# assumed to be. Keep it empty so anonymous requests are rejected.
default_user_name=
authorized_for_system_information=nagiosadmin
authorized_for_configuration_information=nagiosadmin
authorized_for_system_commands=nagiosadmin
authorized_for_all_services=nagiosadmin
authorized_for_all_hosts=nagiosadmin
authorized_for_all_service_commands=nagiosadmin
authorized_for_all_host_commands=nagiosadmin

# Shrinks the classic status log listing to the current day, which keeps the
# volatile-log page fast at higher volumes.
show_all_services_host_group_authorization=0
show_partial_hostgroups=0
show_partial_servicegroups=1

# Defaults for the classic map/WRL views (cosmetic; the JSON API ignores
# these).
statusmap_background_image=gd2.png
statuswrl_include_attributes=0
default_statusmap_layout=5