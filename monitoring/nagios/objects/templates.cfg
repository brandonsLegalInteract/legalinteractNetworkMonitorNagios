###############################################################################
# TEMPLATES.CFG - Object templates referenced by generated configuration
#
# The monitoring interface generates hosts and services that `use` these
# templates, so check scheduling, notification policy and performance-data
# defaults live here instead of inside every generated object.
#
# Important: the generated host objects have no `notification_enabled`
# override and rely on these templates. Only `check_interval`,
# `retry_interval` and `max_check_attempts` are emitted per service by the
# interface.
###############################################################################


###############################################################################
# GENERIC HOST TEMPLATE
###############################################################################

define host {
    name                            generic-host
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1
    notification_period             24x7
    register                        0
}


###############################################################################
# HOSTS GENERATED BY THE MONITORING INTERFACE
###############################################################################

define host {
    name                            monitor-host
    use                             generic-host
    check_command                   check-host-alive
    max_check_attempts              3
    check_interval                  5
    retry_interval                  1
    check_period                    24x7
    notification_interval           60
    notification_options            d,u,r
    contact_groups                  monitoring-admins
    register                        0
}


###############################################################################
# SERVICES GENERATED BY THE MONITORING INTERFACE
###############################################################################

define service {
    name                            monitor-service
    active_checks_enabled           1
    passive_checks_enabled          0
    notifications_enabled           1
    event_handler_enabled           1
    flap_detection_enabled          1
    process_perf_data               1
    retain_status_information       1
    retain_nonstatus_information    1
    is_volatile                     0
    check_period                    24x7
    notification_period             24x7
    notification_interval           60
    notification_options            w,u,c,r
    contact_groups                  monitoring-admins
    register                        0
}