###############################################################################
# CONTACTS.CFG - Who gets notified and how
#
# Edit these three values for your environment:
#   - the contact address in the define contact block
#   - contact_name / alias
# The group below is referenced by the monitor-host and monitor-service
# templates, so every generated object inherits this routing. Change the
# member contact, not the templates, when the roster changes.
###############################################################################

define contact {
    contact_name            nagiosadmin
    alias                   Nagios Administrator
    service_notification_period     24x7
    host_notification_period        24x7
    service_notification_options    w,u,c,r,f,s
    host_notification_options       d,u,r,f,s
    service_notification_commands   notify-service-by-email
    host_notification_commands      notify-host-by-email
    email                           nagios@localhost
}

define contactgroup {
    contactgroup_name   monitoring-admins
    alias               Monitoring Administrators
    members             nagiosadmin
}