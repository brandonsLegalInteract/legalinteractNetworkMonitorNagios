###############################################################################
# COMMANDS.CFG - Monitor commands used by the monitoring interface
#
# Every command resolves the target address through $HOSTADDRESS$ so generated
# service definitions never duplicate addresses or leak host details. All
# plugins come from the monitoring-plugins package ($USER1$).
#
# The commands below are the v1 command vocabulary:
#   monitor-ping            ICMP reachability (device kind)
#   monitor-tcp             TCP port on the target (service kind)
#   monitor-http            HTTP request with path + expected status
#   monitor-https           TLS variant of monitor-http
#   monitor-dns             The target name resolves
#   monitor-dns-expected    The target name resolves to an expected answer
###############################################################################


###############################################################################
# HOST ALIVE
###############################################################################

define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}


###############################################################################
# DEVICE - ICMP reachability
###############################################################################

define command {
    command_name    monitor-ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}


###############################################################################
# SERVICE - TCP port
# $ARG1$ = port
###############################################################################

define command {
    command_name    monitor-tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10 -t 15
}


###############################################################################
# APPLICATION - HTTP(S) endpoint
# $ARG1$ = port  $ARG2$ = path  $ARG3$ = expected status code
#
# The status code goes to -e (--expect: match the response's status line), not
# -s (--string: search the response body). With -s, an endpoint answering
# "HTTP/1.1 200 OK" is reported CRITICAL unless the characters "200" also happen
# to appear in the page content -- a healthy site read as an outage.
###############################################################################

define command {
    command_name    monitor-http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$ -w 5 -c 10 -t 20
}

define command {
    command_name    monitor-https
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$ -S --sni -w 5 -c 10 -t 20
}


###############################################################################
# DNS - name resolution
# monitor-dns:            the target address must resolve
# monitor-dns-expected:   the target address must resolve to $ARG1$
###############################################################################

define command {
    command_name    monitor-dns
    command_line    $USER1$/check_dns -H $HOSTADDRESS$ -w 2 -c 4 -t 15
}

define command {
    command_name    monitor-dns-expected
    command_line    $USER1$/check_dns -H $HOSTADDRESS$ -a $ARG1$ -w 2 -c 4 -t 15
}


###############################################################################
# NOTIFICATIONS
#
# Notification delivery needs a working mail transport on the Nagios host.
# If sendmail/postfix is not installed, notifications fail quietly and the
# monitoring itself is unaffected.
###############################################################################

define command {
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\nHost: $HOSTNAME$\nState: $HOSTSTATE$\nAddress: $HOSTADDRESS$\nInfo: $HOSTOUTPUT$\n\nDate/Time: $LONGDATETIME$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Host Alert: $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}

define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nNotification Type: $NOTIFICATIONTYPE$\n\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nAddress: $HOSTADDRESS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nAdditional Info:\n\n$SERVICEOUTPUT$\n" | /usr/bin/mail -s "** $NOTIFICATIONTYPE$ Service Alert: $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}