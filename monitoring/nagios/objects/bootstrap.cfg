###############################################################################
# BOOTSTRAP.CFG - BASELINE OBJECTS, NOT GENERATED
#
# Nagios refuses to start with no hosts and no services defined ("Error: There
# are no services defined!"). On a host deployment that is harmless — you drop
# generated/hosts.cfg in before first start. On a managed platform (Railway)
# there is no filesystem to pre-seed, so a fresh deploy with an empty
# generated/ directory would crash-loop and never come up far enough for the
# monitoring interface to deploy any targets to it.
#
# This file guarantees at least one host and one service always exist. It also
# doubles as a self-check: if this service is OK, the check engine, the plugin
# path ($USER1$) and the notification wiring are all working.
#
# The monitoring interface never writes here — its exports land in
# objects/generated/ and are additive to this file.
###############################################################################

define host {
    use                 monitor-host
    host_name           monitoring-self
    alias               Nagios Core container
    address             127.0.0.1
}

define service {
    use                     monitor-service
    host_name               monitoring-self
    service_description     Monitoring engine
    check_command           monitor-ping
    max_check_attempts      3
    check_interval          5
    retry_interval          1
}
