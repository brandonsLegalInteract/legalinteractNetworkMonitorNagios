# Apache wiring for the Nagios Core container.
#
# CGIs (including the JSON CGIs) live at /cgi-bin/; the classic HTML UI lives
# at /nagios/. The monitoring interface is normally reached through the UI
# container's nginx proxy, which forwards /cgi-bin/ here untouched.
#
# Both trees require Basic Auth against htpasswd.users (created on first start
# by entrypoint.sh). This is not optional decoration: cgi.cfg sets
# use_authentication=1 with an empty default_user_name, so the CGIs read
# REMOTE_USER to decide authorisation. Without an AuthType here Apache never
# sets REMOTE_USER and every CGI — JSON included — answers "not authorized".

# Quiet the "could not reliably determine the server's fully qualified domain
# name" warning; the real hostname comes from the platform's edge.
ServerName localhost

ScriptAlias /cgi-bin/ /usr/local/nagios/sbin/
<Directory "/usr/local/nagios/sbin">
    Options ExecCGI
    AllowOverride None
    AuthType Basic
    AuthName "Nagios Core"
    AuthUserFile /usr/local/nagios/etc/htpasswd.users
    Require valid-user
</Directory>

# The classic UI is PHP (index.php -> main.php); without mod_php Apache serves
# the source of those files verbatim instead of rendering them.
Alias /nagios /usr/local/nagios/share
<Directory "/usr/local/nagios/share">
    Options Indexes
    DirectoryIndex index.php index.html
    AllowOverride None
    AuthType Basic
    AuthName "Nagios Core"
    AuthUserFile /usr/local/nagios/etc/htpasswd.users
    Require valid-user
</Directory>

# Unauthenticated liveness target for platform health checks. Deliberately
# outside the Nagios document root so it leaks nothing about the monitored
# estate.
Alias /healthz /var/www/health/healthz
<Directory "/var/www/health">
    AllowOverride None
    Require all granted
</Directory>
