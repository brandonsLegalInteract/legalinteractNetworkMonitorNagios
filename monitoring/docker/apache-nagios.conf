# Apache wiring for the Nagios Core container.
#
# CGIs (including the JSON CGIs) live at /cgi-bin/; the classic HTML UI lives
# at /nagios/. The monitoring interface is normally reached through the UI
# container's nginx proxy, which forwards /cgi-bin/ here untouched.

ScriptAlias /cgi-bin/ /usr/local/nagios/sbin/
<Directory "/usr/local/nagios/sbin">
    Options ExecCGI
    AllowOverride None
    Require all granted
</Directory>

Alias /nagios /usr/local/nagios/share
<Directory "/usr/local/nagios/share">
    Options Indexes
    AllowOverride None
    Require all granted
</Directory>